name: OpenCode V2 native E2E qualification (TEST only)

on:
  pull_request:
    paths:
      - scripts/native-v2-readonly-proof.mjs
      - scripts/native-v2-model-candidate.mjs
      - scripts/native-v2-embedded-proof.mjs
      - .github/workflows/native-v2-readonly.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-v2-discovery-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  linux-x64-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        proof: [lifecycle, model, embedded, embedded-model]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.21.0
          package-manager-cache: false
      - name: Validate native TEST harness syntax
        run: |
          node --check scripts/native-v2-readonly-proof.mjs
          node --check scripts/native-v2-model-candidate.mjs
          node --check scripts/native-v2-embedded-proof.mjs
      - name: Install exact official V2 CLI into isolated test prefix
        if: matrix.proof == 'lifecycle' || matrix.proof == 'model'
        shell: bash
        env:
          npm_config_audit: 'false'
          npm_config_fund: 'false'
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/opencode-v2-native/npm" "$RUNNER_TEMP/opencode-v2-native/install-home"
          HOME="$RUNNER_TEMP/opencode-v2-native/install-home" npm install \
            --prefix "$RUNNER_TEMP/opencode-v2-native/npm" \
            --no-save --package-lock=true --ignore-scripts --no-audit --no-fund @opencode/cli@2.0.21
          npm ls --prefix "$RUNNER_TEMP/opencode-v2-native/npm" --depth=0 @opencode/cli
      - name: Install exact pinned embedded V2 SDK without install scripts
        if: startsWith(matrix.proof, 'embedded')
        shell: bash
        env:
          npm_config_audit: 'false'
          npm_config_fund: 'false'
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/opencode-v2-embedded"
          npm install --prefix "$RUNNER_TEMP/opencode-v2-embedded" --no-save \
            --package-lock=true --ignore-scripts --no-audit --no-fund @opencode/sdk@2.0.21
          npm ls --prefix "$RUNNER_TEMP/opencode-v2-embedded" --depth=0 @opencode/sdk
      - name: TEST native binary, authenticated API and disposable session lifecycle
        if: matrix.proof == 'lifecycle'
        env:
          OPENCODE_V2_TEST_NPM_ROOT: ${{ runner.temp }}/opencode-v2-native/npm/node_modules/@opencode
          OPENCODE_V2_TEST_RECEIPT: ${{ github.workspace }}/native-v2-readonly-proof.json
        run: node scripts/native-v2-readonly-proof.mjs
      - name: TEST native local model turn and durable terminal qualification
        if: matrix.proof == 'model'
        env:
          OPENCODE_V2_TEST_NPM_ROOT: ${{ runner.temp }}/opencode-v2-native/npm/node_modules/@opencode
          OPENCODE_V2_TEST_MODEL_RECEIPT: ${{ github.workspace }}/native-v2-model-candidate.json
        run: node scripts/native-v2-model-candidate.mjs
      - name: TEST embedded V2 persistent event log through cold host restart
        if: startsWith(matrix.proof, 'embedded')
        env:
          OPENCODE_V2_EMBEDDED_NPM_PREFIX: ${{ runner.temp }}/opencode-v2-embedded
          OPENCODE_V2_EMBEDDED_RECEIPT: ${{ github.workspace }}/native-v2-${{ matrix.proof }}-proof.json
          OPENCODE_V2_EMBEDDED_MODEL_PROOF: ${{ matrix.proof == 'embedded-model' && '1' || '0' }}
        run: node scripts/native-v2-embedded-proof.mjs
      - name: Upload actual runner receipt (even for failed native checks)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: opencode-v2-native-discovery-linux-x64-${{ matrix.proof }}
          if-no-files-found: warn
          retention-days: 7
          path: |
            native-v2-readonly-proof.json
            native-v2-model-candidate.json
            native-v2-embedded-proof.json
            native-v2-embedded-model-proof.json
            ${{ runner.temp }}/opencode-v2-embedded/package-lock.json
            ${{ runner.temp }}/opencode-v2-native/npm/package-lock.json

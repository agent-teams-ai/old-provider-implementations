name: CI
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: ['24.21.0', '26.11.1']
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Setup Node24 Corepack source
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.21.0
          package-manager-cache: false
      - name: Setup selected Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - name: Select pinned pnpm through selected Node
        shell: bash
        run: |
          set -euo pipefail
          selectedNode="$(node -p 'process.execPath')"
          corepackJs="$RUNNER_TOOL_CACHE/node/24.21.0/$(node -p 'process.arch')/lib/node_modules/corepack/dist/corepack.js"
          test -f "$corepackJs"
          mkdir -p "$RUNNER_TEMP/toolchain/bin" "$RUNNER_TEMP/toolchain/corepack"
          printf '#!/bin/sh\nexec "%s" "%s" pnpm@11.18.0 "$@"\n' "$selectedNode" "$corepackJs" > "$RUNNER_TEMP/toolchain/bin/pnpm"
          chmod 755 "$RUNNER_TEMP/toolchain/bin/pnpm"
          printf '%s\n' "$RUNNER_TEMP/toolchain/bin" >> "$GITHUB_PATH"
          printf 'COREPACK_HOME=%s\n' "$RUNNER_TEMP/toolchain/corepack" >> "$GITHUB_ENV"
          COREPACK_HOME="$RUNNER_TEMP/toolchain/corepack" "$selectedNode" "$corepackJs" pnpm@11.18.0 --version
      - name: Install exact dependency graph
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Types, controlled tests and packed consumers
        env:
          # Retain the SAME exact bytes installed by the package-consumer test.
          AGENT_TEAMS_PROVIDER_PACK_TEST_RETAIN_DIR: ${{ runner.temp }}/checked-v2-spi
        run: pnpm check
      - name: Record exact-head checked archives (not a Host qualification)
        if: matrix.node == '24.21.0'
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          node --input-type=module <<'NODE'
          import { createHash } from 'node:crypto'
          import { execFileSync } from 'node:child_process'
          import { readFileSync, readdirSync, writeFileSync } from 'node:fs'
          import { join } from 'node:path'
          const root = join(process.env.RUNNER_TEMP, 'checked-v2-spi')
          const names = readdirSync(root).filter(name => name.endsWith('.tgz')).sort()
          if (names.length !== 2 ||
              names.filter(name => name.startsWith('agent-teams-provider-implementations-')).length !== 1 ||
              names.filter(name => name.startsWith('agent-teams-provider-session-contracts-')).length !== 1)
            throw Error('expected_exact_two_consumer_checked_archives')
          const head = execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim()
          if (head !== process.env.EXPECTED_HEAD) throw Error('unexpected_checkout_head')
          const packages = names.map(name => {
            const data = readFileSync(join(root, name))
            return { file: name, bytes: data.length,
              sha256: createHash('sha256').update(data).digest('hex') }
          })
          const receipt = { schemaVersion: 1, sourceCommit: head, packages,
            qualification: 'source-and-packed-consumer-only',
            nativeHostQualified: false, packagedElectronQualified: false }
          writeFileSync(join(root, 'receipt.json'), JSON.stringify(receipt, null, 2) + '\\n')
          console.log(JSON.stringify(receipt))
          NODE
      - name: Upload TEST-only exact-HEAD checked provider and Session SPI archives
        if: matrix.node == '24.21.0'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: opencode-v2-spi-consumer-checked-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/checked-v2-spi/
          if-no-files-found: error
          retention-days: 7
